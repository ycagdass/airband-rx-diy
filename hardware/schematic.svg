<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="monospace" font-size="12">
  <rect width="900" height="620" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" fill="#e0e0e0" font-size="18" font-weight="bold">airband-rx-diy — Devre Şeması (118–137 MHz VHF AM Alıcı)</text>
  <text x="450" y="52" text-anchor="middle" fill="#888" font-size="11">Doğrudan Dönüşüm (Direct Conversion) Mimarisi</text>

  <!-- ═══════════════ ANTEN ═══════════════ -->
  <g id="anten">
    <text x="62" y="130" fill="#a8d8a8" font-size="13" font-weight="bold">ANTEN</text>
    <text x="50" y="148" fill="#ccc" font-size="10">~58 cm</text>
    <text x="50" y="162" fill="#ccc" font-size="10">bakır tel</text>
    <!-- anten sembolü -->
    <line x1="80" y1="200" x2="80" y2="260" stroke="#a8d8a8" stroke-width="2"/>
    <line x1="60" y1="200" x2="100" y2="200" stroke="#a8d8a8" stroke-width="2"/>
    <line x1="65" y1="193" x2="95" y2="193" stroke="#a8d8a8" stroke-width="1.5"/>
    <line x1="70" y1="186" x2="90" y2="186" stroke="#a8d8a8" stroke-width="1.5"/>
    <!-- kablo to cap -->
    <line x1="80" y1="260" x2="80" y2="295" stroke="#a8d8a8" stroke-width="2"/>
    <!-- 100 pF -->
    <line x1="70" y1="295" x2="90" y2="295" stroke="#f0c060" stroke-width="2.5"/>
    <line x1="70" y1="302" x2="90" y2="302" stroke="#f0c060" stroke-width="2.5"/>
    <text x="96" y="302" fill="#f0c060" font-size="10">100 pF</text>
    <line x1="80" y1="302" x2="80" y2="330" stroke="#a8d8a8" stroke-width="2"/>
    <text x="88" y="325" fill="#aaa" font-size="9">→ NE602 pin 1</text>
  </g>

  <!-- ═══════════════ NE602AN MIXER ═══════════════ -->
  <g id="ne602">
    <rect x="210" y="160" width="160" height="220" rx="8" fill="#16213e" stroke="#4a90d9" stroke-width="2"/>
    <text x="290" y="183" text-anchor="middle" fill="#4a90d9" font-size="14" font-weight="bold">NE602AN</text>
    <text x="290" y="198" text-anchor="middle" fill="#888" font-size="10">MİKSER</text>
    <text x="290" y="212" text-anchor="middle" fill="#888" font-size="10">5 V besleme</text>

    <!-- Pin labels left -->
    <text x="216" y="240" fill="#ccc" font-size="10">1 IN_A</text>
    <text x="216" y="262" fill="#ccc" font-size="10">2 IN_B</text>
    <text x="216" y="284" fill="#888" font-size="10">3 GND</text>
    <text x="216" y="306" fill="#e8a0a0" font-size="10">4 OUT_A</text>

    <!-- Pin labels right -->
    <text x="314" y="240" fill="#f0c060" font-size="10">8 VCC ►</text>
    <text x="314" y="262" fill="#888" font-size="10">7 OSC_E</text>
    <text x="314" y="284" fill="#a8d8a8" font-size="10">6 OSC_B ◄</text>
    <text x="314" y="306" fill="#888" font-size="10">5 OUT_B</text>

    <!-- pin connector dots left -->
    <circle cx="210" cy="236" r="3" fill="#4a90d9"/>
    <circle cx="210" cy="258" r="3" fill="#888"/>
    <circle cx="210" cy="280" r="3" fill="#888"/>
    <circle cx="210" cy="302" r="3" fill="#e8a0a0"/>
    <!-- pin connector dots right -->
    <circle cx="370" cy="236" r="3" fill="#f0c060"/>
    <circle cx="370" cy="258" r="3" fill="#888"/>
    <circle cx="370" cy="280" r="3" fill="#a8d8a8"/>

    <!-- pin 2 → GND via cap -->
    <line x1="210" y1="258" x2="175" y2="258" stroke="#888" stroke-width="1.5"/>
    <line x1="175" y1="250" x2="175" y2="266" stroke="#f0c060" stroke-width="2.5"/>
    <line x1="167" y1="250" x2="167" y2="266" stroke="#f0c060" stroke-width="2.5"/>
    <text x="140" y="256" fill="#f0c060" font-size="9">100 nF</text>
    <line x1="167" y1="258" x2="155" y2="258" stroke="#888" stroke-width="1.5"/>
    <line x1="155" y1="258" x2="155" y2="390" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="140" y="274" fill="#888" font-size="9">GND</text>
  </g>

  <!-- ═══════════════ Si5351 ═══════════════ -->
  <g id="si5351">
    <rect x="460" y="160" width="150" height="140" rx="8" fill="#16213e" stroke="#a8d8a8" stroke-width="2"/>
    <text x="535" y="182" text-anchor="middle" fill="#a8d8a8" font-size="13" font-weight="bold">Si5351</text>
    <text x="535" y="197" text-anchor="middle" fill="#888" font-size="10">FREKANS ÜRETECİ</text>
    <text x="535" y="210" text-anchor="middle" fill="#888" font-size="10">25 MHz kristal</text>

    <text x="466" y="232" fill="#ccc" font-size="10">3V3 ◄</text>
    <text x="466" y="250" fill="#888" font-size="10">GND</text>
    <text x="466" y="268" fill="#a8d8a8" font-size="10">SDA (GPIO21)</text>
    <text x="466" y="286" fill="#a8d8a8" font-size="10">SCL (GPIO22)</text>

    <text x="530" y="232" fill="#a8d8a8" font-size="10">CLK0 ►</text>
    <text x="530" y="250" fill="#888" font-size="10">CLK1</text>
    <text x="530" y="268" fill="#888" font-size="10">CLK2</text>

    <circle cx="610" cy="228" r="3" fill="#a8d8a8"/>
  </g>

  <!-- ESP32 -->
  <g id="esp32">
    <rect x="460" y="340" width="150" height="110" rx="8" fill="#16213e" stroke="#c084fc" stroke-width="2"/>
    <text x="535" y="362" text-anchor="middle" fill="#c084fc" font-size="13" font-weight="bold">ESP32</text>
    <text x="535" y="377" text-anchor="middle" fill="#888" font-size="10">DevKit</text>

    <text x="466" y="400" fill="#f0c060" font-size="10">5V (VIN) ►</text>
    <text x="466" y="418" fill="#ccc" font-size="10">3V3 ►</text>
    <text x="466" y="436" fill="#888" font-size="10">GND</text>

    <text x="530" y="400" fill="#a8d8a8" font-size="10">GPIO21 (SDA)</text>
    <text x="530" y="418" fill="#a8d8a8" font-size="10">GPIO22 (SCL)</text>

    <circle cx="460" cy="396" r="3" fill="#f0c060"/>
    <circle cx="460" cy="414" r="3" fill="#ccc"/>
    <circle cx="460" cy="432" r="3" fill="#888"/>
  </g>

  <!-- ESP32 → Si5351 I2C -->
  <line x1="535" y1="340" x2="535" y2="300" stroke="#a8d8a8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="540" y="320" fill="#a8d8a8" font-size="9">I2C</text>

  <!-- ESP32 5V → NE602 VCC -->
  <line x1="460" y1="396" x2="420" y2="396" stroke="#f0c060" stroke-width="1.5"/>
  <line x1="420" y1="396" x2="420" y2="236" stroke="#f0c060" stroke-width="1.5"/>
  <line x1="420" y1="236" x2="370" y2="236" stroke="#f0c060" stroke-width="1.5"/>
  <text x="425" y="300" fill="#f0c060" font-size="9">+5 V</text>

  <!-- Si5351 CLK0 → zayıflatıcı → NE602 pin6 -->
  <line x1="610" y1="228" x2="650" y2="228" stroke="#a8d8a8" stroke-width="1.5"/>
  <line x1="650" y1="228" x2="650" y2="130" stroke="#a8d8a8" stroke-width="1.5"/>
  <line x1="650" y1="130" x2="390" y2="130" stroke="#a8d8a8" stroke-width="1.5"/>
  <!-- 1k resistor symbol -->
  <rect x="470" y="123" width="36" height="14" rx="2" fill="none" stroke="#f0c060" stroke-width="1.5"/>
  <text x="488" y="134" text-anchor="middle" fill="#f0c060" font-size="9">1 kΩ</text>
  <!-- düğüm -->
  <circle cx="430" cy="130" r="4" fill="#a8d8a8"/>
  <!-- 100Ω to GND -->
  <line x1="430" y1="134" x2="430" y2="155" stroke="#aaa" stroke-width="1.5"/>
  <rect x="421" y="155" width="18" height="12" rx="2" fill="none" stroke="#f0c060" stroke-width="1.5"/>
  <text x="430" y="165" text-anchor="middle" fill="#f0c060" font-size="9">110Ω</text>
  <line x1="430" y1="167" x2="430" y2="180" stroke="#888" stroke-width="1.5"/>
  <line x1="425" y1="180" x2="435" y2="180" stroke="#888" stroke-width="1.5"/>
  <line x1="427" y1="184" x2="433" y2="184" stroke="#888" stroke-width="1.5"/>
  <text x="440" y="184" fill="#888" font-size="9">GND</text>
  <!-- 100pF to pin6 -->
  <line x1="430" y1="130" x2="390" y2="130" stroke="#a8d8a8" stroke-width="1.5"/>
  <line x1="390" y1="123" x2="390" y2="137" stroke="#f0c060" stroke-width="2.5"/>
  <line x1="384" y1="123" x2="384" y2="137" stroke="#f0c060" stroke-width="2.5"/>
  <text x="367" y="122" fill="#f0c060" font-size="9">100 pF</text>
  <line x1="384" y1="130" x2="370" y2="130" stroke="#a8d8a8" stroke-width="1.5"/>
  <line x1="370" y1="130" x2="370" y2="280" stroke="#a8d8a8" stroke-width="1.5"/>

  <!-- NE602 pin4 OUT_A → 10µF → pot -->
  <line x1="210" y1="302" x2="150" y2="302" stroke="#e8a0a0" stroke-width="2"/>
  <line x1="150" y1="295" x2="150" y2="309" stroke="#f0c060" stroke-width="2.5"/>
  <line x1="143" y1="295" x2="143" y2="309" stroke="#f0c060" stroke-width="2.5"/>
  <text x="108" y="301" fill="#f0c060" font-size="9">10 µF (+)</text>
  <line x1="143" y1="302" x2="120" y2="302" stroke="#e8a0a0" stroke-width="2"/>
  <text x="60" y="302" fill="#e8a0a0" font-size="10">→ POT</text>
  <text x="55" y="314" fill="#e8a0a0" font-size="10">sağ ucu</text>

  <!-- ═══════════════ LM386 ═══════════════ -->
  <g id="lm386">
    <rect x="60" y="390" width="160" height="190" rx="8" fill="#16213e" stroke="#f4a261" stroke-width="2"/>
    <text x="140" y="412" text-anchor="middle" fill="#f4a261" font-size="14" font-weight="bold">LM386N-1</text>
    <text x="140" y="428" text-anchor="middle" fill="#888" font-size="10">SES KATı</text>
    <text x="140" y="442" text-anchor="middle" fill="#888" font-size="10">8,9 V besleme</text>

    <text x="66" y="465" fill="#888" font-size="10">1 Gain (boş)</text>
    <text x="66" y="482" fill="#888" font-size="10">2 IN− → GND</text>
    <text x="66" y="499" fill="#e8a0a0" font-size="10">3 IN+ ← POT</text>
    <text x="66" y="516" fill="#888" font-size="10">4 GND</text>
    <text x="66" y="533" fill="#888" font-size="10">5 OUT</text>
    <text x="66" y="550" fill="#f0c060" font-size="10">6 VCC 8,9 V</text>
    <text x="66" y="567" fill="#888" font-size="10">7 Bypass (boş)</text>
    <text x="66" y="581" fill="#888" font-size="10">8 Gain (boş)</text>

    <circle cx="60" cy="461" r="3" fill="#888"/>
    <circle cx="60" cy="478" r="3" fill="#888"/>
    <circle cx="60" cy="495" r="3" fill="#e8a0a0"/>
    <circle cx="60" cy="529" r="3" fill="#888"/>
    <circle cx="220" cy="461" r="3" fill="#888"/>
    <circle cx="220" cy="478" r="3" fill="#888"/>
    <circle cx="220" cy="495" r="3" fill="#888"/>
    <circle cx="220" cy="512" r="3" fill="#888"/>
  </g>

  <!-- POT -->
  <g id="pot">
    <rect x="270" y="390" width="100" height="60" rx="6" fill="#16213e" stroke="#888" stroke-width="1.5"/>
    <text x="320" y="414" text-anchor="middle" fill="#ccc" font-size="11" font-weight="bold">10 kΩ POT</text>
    <text x="320" y="430" text-anchor="middle" fill="#888" font-size="9">Sol → GND</text>
    <text x="320" y="443" text-anchor="middle" fill="#888" font-size="9">Orta → LM386 pin3</text>
    <!-- pot → LM386 pin3 -->
    <line x1="270" y1="430" x2="220" y2="430" stroke="#e8a0a0" stroke-width="1.5"/>
    <line x1="220" y1="430" x2="220" y2="495" stroke="#e8a0a0" stroke-width="1.5"/>
  </g>

  <!-- Çıkış kondansatörü ve Zobel -->
  <g id="output">
    <text x="310" y="490" fill="#ccc" font-size="10">220 µF (+←pin5)</text>
    <text x="310" y="505" fill="#aaa" font-size="9">Zobel: 10Ω + 47nF → GND</text>
    <text x="310" y="520" fill="#aaa" font-size="9">Dekuplaj: 100µF + 100nF (pin6-4)</text>

    <!-- JAK -->
    <rect x="310" y="530" width="110" height="45" rx="6" fill="#16213e" stroke="#888" stroke-width="1.5"/>
    <text x="365" y="550" text-anchor="middle" fill="#ccc" font-size="11" font-weight="bold">3,5 mm JAK</text>
    <text x="365" y="564" text-anchor="middle" fill="#888" font-size="9">101Ω seri → pin2 &amp; pin4</text>
    <!-- → kulaklık -->
    <line x1="420" y1="552" x2="445" y2="552" stroke="#ccc" stroke-width="1.5"/>
    <text x="450" y="556" fill="#a8d8a8" font-size="11">🎧 Kulaklık</text>
  </g>

  <!-- GND bus -->
  <line x1="60" y1="590" x2="840" y2="590" stroke="#888" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="430" y="610" text-anchor="middle" fill="#888" font-size="10">─────────── ORTAK GND HATTI (tüm modüller) ───────────</text>

  <!-- Legend -->
  <g id="legend">
    <rect x="680" y="160" width="200" height="180" rx="6" fill="#0d0d1a" stroke="#444" stroke-width="1"/>
    <text x="780" y="180" text-anchor="middle" fill="#aaa" font-size="11" font-weight="bold">AÇIKLAMA</text>
    <line x1="695" y1="200" x2="720" y2="200" stroke="#a8d8a8" stroke-width="2"/>
    <text x="728" y="204" fill="#ccc" font-size="10">LO / kontrol sinyali</text>
    <line x1="695" y1="218" x2="720" y2="218" stroke="#f0c060" stroke-width="2"/>
    <text x="728" y="222" fill="#ccc" font-size="10">Kondansatör</text>
    <line x1="695" y1="236" x2="720" y2="236" stroke="#e8a0a0" stroke-width="2"/>
    <text x="728" y="240" fill="#ccc" font-size="10">Ses sinyali</text>
    <line x1="695" y1="254" x2="720" y2="254" stroke="#4a90d9" stroke-width="2"/>
    <text x="728" y="258" fill="#ccc" font-size="10">NE602 bağlantısı</text>
    <line x1="695" y1="272" x2="720" y2="272" stroke="#f4a261" stroke-width="2"/>
    <text x="728" y="276" fill="#ccc" font-size="10">LM386 bağlantısı</text>
    <line x1="695" y1="290" x2="720" y2="290" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="728" y="294" fill="#ccc" font-size="10">I2C / GND ortak hat</text>
    <text x="780" y="328" text-anchor="middle" fill="#666" font-size="9">github.com/cagdass/airband-rx-diy</text>
  </g>

  <!-- Version / note -->
  <text x="10" y="615" fill="#444" font-size="9">v0.1 — 2026-11-09 — Yusuf Çağdaş — Doğrulanan: ses katı + mikser ton testi. Havadan sinyal henüz alınmadı.</text>
</svg>
